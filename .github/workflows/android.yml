

name: Build MetaH TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP if present
        run: |
          if [ -f "MetaH-TV-Android-Project.zip" ]; then
            unzip -o "MetaH-TV-Android-Project.zip" -d extracted
          fi

      - name: Locate project
        run: |
          if [ -f "extracted/metah_tv_project/app/build.gradle" ]; then
            echo "PROJECT_DIR=extracted/metah_tv_project" >> "$GITHUB_ENV"
          elif [ -f "metah_tv_project/app/build.gradle" ]; then
            echo "PROJECT_DIR=metah_tv_project" >> "$GITHUB_ENV"
          elif [ -f "app/build.gradle" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "Could not find app/build.gradle"
            find . -name build.gradle -print
            exit 1
          fi

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MetaH-TV-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
