
name: Build MetaH TV APK

on:
  push:
    paths:
      - 'MetaH-TV-Android-Project.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q MetaH-TV-Android-Project.zip -d extracted
          test -f extracted/metah_tv_project/app/build.gradle

      - name: Build APK
        working-directory: extracted/metah_tv_project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MetaH-TV-APK
          path: extracted/metah_tv_project/app/build/outputs/apk/debug/app-debug.apk
